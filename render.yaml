# dinner-wizard static site is the old public URL.
# Signed-in app is dinner-wizard-app (Python). Do not touch strumcity-line-dock.
services:
  - type: web
    name: dinner-wizard
    runtime: static
    buildCommand: echo "DINNER WIZARD redirects to signed-in app"
    staticPublishPath: redirect-site
    routes:
      - type: redirect
        source: /*
        destination: https://dinner-wizard-app.onrender.com/*
    headers:
      - path: /*
        name: Cache-Control
        value: no-store
  - type: web
    name: dinner-wizard-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT server:app
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATA_DIR
        value: /opt/render/project/src/data
