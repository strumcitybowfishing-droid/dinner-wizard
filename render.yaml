# dinner-wizard static site is the old public URL.
# Signed-in app is dinner-wizard-app (Python). Do not touch strumcity-line-dock.
services:
  - type: web
    name: dinner-wizard
    runtime: static
    buildCommand: echo "DINNER WIZARD static"
    staticPublishPath: .
    headers:
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
      - path: /*
        name: Cache-Control
        value: public, max-age=60
  - type: web
    name: dinner-wizard-app
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT server:app
    healthCheckPath: /ping
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DATA_DIR
        value: /opt/render/project/src/data
